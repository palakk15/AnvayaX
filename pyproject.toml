[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bharatblend"
version = "0.1.0"
description = "Auditable probabilistic AI–NWP forecast blending and verification"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3", "scipy>=1.12,<2", "pandas>=2.2,<3",
  "pydantic>=2.7,<3", "scikit-learn>=1.5,<2", "requests>=2.32,<3",
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "plotly>=5.24,<7",
  "streamlit>=1.50,<2", "PyYAML>=6,<7", "xarray>=2024.6", "h5netcdf>=1.3", "h5py>=3.10"
]

[project.optional-dependencies]
accuracy = ["torch>=2.4,<3"]
research = ["xgboost>=2.1,<4", "scores>=2.0,<3", "dask[array]>=2024.6", "zarr>=2.18,<3"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9"]

[project.scripts]
bharatblend = "bharatblend.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bharatblend"]

[tool.hatch.build.targets.wheel.force-include]
"configs" = "bharatblend/configs"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
